name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: node scripts/generate-panel-config.mjs && git diff --exit-code -- config/tovarish-panel.json
      - run: npm run typecheck && npm run lint && npm test && npm run start:build
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm test && NODE_ENV=production npm run build
        working-directory: backend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: docker/setup-buildx-action@v4
      - run: docker buildx build --load -t green-subpage:test .
      - run: node scripts/compatibility-smoke.mjs --docker green-subpage:test
      - run: SMOKE_PREFIX= node scripts/compatibility-smoke.mjs --docker green-subpage:test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
          retention-days: 7
